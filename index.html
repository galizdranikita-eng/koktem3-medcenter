<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
body{display:flex;justify-content:center}
#app{width:100%;max-width:540px;min-height:100dvh;background:var(--bg);padding-bottom:82px}
.top{position:sticky;top:0;z-index:40;background:rgba(243,247,246,.95);backdrop-filter:blur(15px);border-bottom:1px solid rgba(223,233,230,.8);padding:12px 15px 10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--g),var(--g2));display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900;box-shadow:0 7px 18px rgba(12,107,93,.18)}
.brand b{font-size:18px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.branch-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e7eeec;padding:4px;border-radius:14px;margin-top:10px}
.branch-btn{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-size:11px;font-weight:900;color:#6d7a77}
.branch-btn.active{background:#fff;color:var(--g);box-shadow:0 2px 9px rgba(30,55,50,.08)}
.branch-btn.med.active{color:var(--blue)}
.screen{display:none;padding:13px 15px 26px}.screen.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{border-radius:27px;padding:23px;color:white;box-shadow:0 15px 35px rgba(20,70,60,.16);position:relative;overflow:hidden}
.hero.dental{background:linear-gradient(145deg,#075b50,#14937c)}
.hero.med{background:linear-gradient(145deg,#275c88,#4b99cc)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:180px;height:180px;right:-75px;top:-95px}.hero:after{width:130px;height:130px;right:30px;bottom:-95px}
.eyebrow{position:relative;z-index:1;font-size:10px;font-weight:900;letter-spacing:1.2px;color:#d8f5ed}
.hero.med .eyebrow{color:#dceefe}
.hero h1{position:relative;z-index:1;font-size:31px;line-height:1.04;letter-spacing:-1px;margin:12px 0 11px}
.hero p{position:relative;z-index:1;font-size:13px;line-height:1.5;color:#e7f7f3;margin:0 0 17px;max-width:390px}
.hero.med p{color:#e8f3fb}
.btn{border:0;border-radius:15px;background:var(--g);color:#fff;min-height:46px;padding:0 16px;font-weight:900;font-size:13px}
.med-theme .btn.primary,.btn.medprimary{background:var(--blue)}
.btn.white{background:#fff;color:var(--g)}.hero.med .btn.white{color:var(--blue)}
.btn.soft{background:var(--soft);color:var(--g)}.btn.softblue{background:var(--softblue);color:var(--blue)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--g)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #efd3d0}
.btn.full{width:100%}.btn.small{min-height:37px;padding:0 12px;border-radius:11px;font-size:11px}
.section-title{font-size:20px;font-weight:900;letter-spacing:-.4px;margin:21px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quick,.card,.service-card,.doctor,.doctor-card,.slot,.date,.admin-item,.price-item{background:#fff;border:1px solid var(--line);border-radius:19px}
.quick{padding:14px;text-align:left}.quick .ico{font-size:23px}.quick b{display:block;margin-top:8px;font-size:13px}.quick small{font-size:10px;color:var(--muted)}
.card{padding:16px;margin-top:10px}.kicker{font-size:9px;font-weight:900;letter-spacing:1.1px;color:var(--g);margin-bottom:5px}.med-theme .kicker{color:var(--blue)}
.card h3{margin:0;font-size:17px}.muted{color:var(--muted);font-size:11px;line-height:1.5}.info{font-size:12px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.badge{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;background:var(--amber);color:#725600;white-space:nowrap}
.badge.ok{background:#dcf6ee;color:#157d68}.badge.cancel{background:#fde5e2;color:var(--danger)}
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.service-card{padding:14px;min-height:128px;text-align:left;position:relative;overflow:hidden}
.service-card:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-24px;bottom:-24px;background:rgba(12,107,93,.05)}
.med-theme .service-card:after{background:rgba(47,111,166,.06)}
.service-card .ico{font-size:25px}.service-card b{display:block;font-size:13px;margin:9px 0 4px}.service-card small{display:block;font-size:10px;color:var(--muted);line-height:1.35}
.service-card.sel,.doctor.sel,.date.sel,.slot.sel{border-color:var(--g);box-shadow:0 0 0 3px rgba(12,107,93,.07)}
.med-theme .service-card.sel,.med-theme .doctor.sel,.med-theme .date.sel,.med-theme .slot.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,166,.07)}
.steps{display:flex;gap:5px;margin:8px 0 18px}.bar{height:6px;background:#dce7e4;border-radius:99px;flex:1}.bar.on{background:var(--g)}.med-theme .bar.on{background:var(--blue)}
.title{font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.05;margin:7px 0}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:14px}
.doctor{width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:11px;margin-bottom:8px}
.avatar{width:68px;height:68px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#dcefe8,#eef7f4);flex:0 0 68px;position:relative}
.med-theme .avatar{background:linear-gradient(145deg,#deedf8,#eef6fb)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900;color:var(--g)}
.med-theme .avatar .fallback{color:var(--blue)}
.doctor .copy{flex:1}.doctor b{font-size:12px;line-height:1.3}.doctor small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.3}.dot{font-size:20px;color:#d5e1dd}.sel .dot{color:var(--g)}.med-theme .sel .dot{color:var(--blue)}
.doctor-card{overflow:hidden}
.doctor-card .photo{height:168px;background:linear-gradient(145deg,#e0f1eb,#f2f8f6);position:relative}
.med-theme .doctor-card .photo{background:linear-gradient(145deg,#e2eef8,#f4f8fb)}
.doctor-card img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}
.doctor-card .initials{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--g)}.med-theme .doctor-card .initials{color:var(--blue)}
.doctor-card .inner{padding:13px}.doctor-card b{font-size:13px;line-height:1.3}.doctor-card small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin:4px 0 10px}
.dates{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:2px 0 8px}.dates::-webkit-scrollbar{display:none}
.date{min-width:72px;padding:9px 7px;text-align:center}.date span{display:block;font-size:9px;color:var(--muted)}.date strong{font-size:19px;display:block;margin:2px 0}.date.sel{background:var(--g);color:#fff}.med-theme .date.sel{background:var(--blue)}.date.sel span{color:#e3f5ef}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{padding:11px 4px;text-align:center;font-weight:900;font-size:12px}.slot.busy{opacity:.25;text-decoration:line-through}
.label{font-size:11px;font-weight:900;margin:12px 0 6px;display:block}
.input,.select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-size:14px;outline:none}.input:focus,.select:focus{border-color:var(--g)}
.med-theme .input:focus,.med-theme .select:focus{border-color:var(--blue)}
.summary{background:#eef7f4;border-radius:18px;padding:13px;margin:10px 0}.med-theme .summary{background:#edf5fb}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:11px}.sumrow span{color:var(--muted)}.sumrow b{text-align:right}
.nav{display:flex;gap:8px;margin-top:18px}.nav .btn:last-child{margin-left:auto}
.success{text-align:center;padding:28px 4px}.okmark{width:78px;height:78px;border-radius:50%;background:var(--soft);color:var(--g);display:grid;place-items:center;font-size:38px;margin:0 auto 15px}.med-theme .okmark{background:var(--softblue);color:var(--blue)}
.success h2{font-size:28px;margin:0 0 8px}.success p{font-size:12px;line-height:1.5;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:transparent;color:#82918d;font-size:9px;font-weight:900}.tab i{font-style:normal;display:block;font-size:20px;margin-bottom:3px}.tab.active{color:var(--g)}.med-theme .tab.active{color:var(--blue)}
.note{background:#fff9e8;border:1px solid #f0e2ba;color:#725b1d;padding:10px;border-radius:13px;font-size:10px;line-height:1.4;margin-top:10px}
.tag{display:inline-block;background:#edf7f3;color:var(--g);padding:5px 7px;border-radius:999px;font-size:9px;font-weight:900;margin:3px 3px 0 0}.med-theme .tag{background:#edf5fb;color:var(--blue)}
.search{display:flex;gap:7px}.search .input{flex:1}.search .select{max-width:42%}
.price-item{padding:13px;margin-bottom:8px}.price-item b{font-size:12px;display:block}.price-item .amount{font-size:11px;font-weight:900;color:var(--g);margin-top:4px}.med-theme .price-item .amount{color:var(--blue)}
.admin-item{padding:13px;margin-bottom:9px}.status-select{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.admin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e7eeec;border-radius:13px;padding:4px;margin:10px 0}.admin-tab{border:0;background:transparent;border-radius:10px;padding:9px;font-size:11px;font-weight:900}.admin-tab.active{background:#fff;color:var(--g)}
.install-banner{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px;gap:10px;align-items:center}.install-banner.show{display:flex}.install-banner b{font-size:12px}.install-banner small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.install-banner .copy{flex:1}
@media(max-width:360px){.grid2,.service-grid{grid-template-columns:1fr}.title{font-size:25px}}
</style>
</head>

     {id:'regmed',initials:'К3',name:'Регистратура медицинского центра',spec:'Подберём специалиста или кабинет',photo:''}
   ]
 }
};

const defaultPriceData={
 dental:[
   {id:'dp1',name:'Консультация стоматолога',price:'Уточнить'},
   {id:'dp2',name:'Лечение зубов',price:'Уточнить'},
   {id:'dp3',name:'Профессиональная гигиена',price:'Уточнить'},
   {id:'dp4',name:'Имплантология',price:'После консультации'},
   {id:'dp5',name:'Ортопедия / протезирование',price:'После консультации'},
   {id:'dp6',name:'Детская стоматология',price:'Уточнить'}
 ],
 med:[
   {id:'mp1',name:'Консультация специалиста',price:'Уточнить'},
   {id:'mp2',name:'УЗИ',price:'Уточнить'},
   {id:'mp3',name:'ФГДС',price:'Уточнить'},
   {id:'mp4',name:'Лабораторные анализы',price:'По исследованию'},
   {id:'mp5',name:'Физиотерапия',price:'Уточнить'},
   {id:'mp6',name:'Медицинская комиссия',price:'Уточнить'}
 ]
};

let currentBranch=localStorage.getItem('k3_branch')||'dental';
let booking={step:1,service:null,doctor:null,date:null,time:null};
let adminSection='requests';
let deferredPrompt=null;

const qs=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const B=()=>branches[currentBranch];

function applyTheme(){
 document.getElementById('app').classList.toggle('med-theme',currentBranch==='med');
 qs('#branchDental').classList.toggle('active',currentBranch==='dental');
 qs('#branchMed').classList.toggle('active',currentBranch==='med');
}
function switchBranch(id){
 currentBranch=id; localStorage.setItem('k3_branch',id); applyTheme();
 const active=document.querySelector('.screen.active')?.id||'home';
 if(active==='booking') startBooking(); else showTab(active);
}
function showTab(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 qs('#'+id).classList.add('active');
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
 if(id==='home')renderHome();
 if(id==='doctors')renderDoctors();
 if(id==='prices')renderPrices();
 if(id==='admin')renderAdmin();
 window.scrollTo(0,0);
}
function getBookings(){try{return JSON.parse(localStorage.getItem('k3_bookings_v3')||'[]')}catch{return[]}}
function setBookings(v){localStorage.setItem('k3_bookings_v3',JSON.stringify(v))}
function getPrices(){try{return JSON.parse(localStorage.getItem('k3_prices_v3')||JSON.stringify(defaultPriceData))}catch{return JSON.parse(JSON.stringify(defaultPriceData))}}
function setPrices(v){localStorage.setItem('k3_prices_v3',JSON.stringify(v))}
function getService(id=booking.service){return B().services.find(x=>x.id===id)}
function getDoctor(id=booking.doctor){return B().doctors.find(x=>x.id===id)}
function badgeClass(s){return s==='Подтверждена'||s==='Завершена'?'ok':s==='Отменена'?'cancel':''}

function renderHome(){
 const b=B(), list=getBookings().filter(x=>x.branch===currentBranch), latest=list[0];
 qs('#home').innerHTML=`
  <div class="hero ${b.theme}">
   <div class="eyebrow">${b.icon} ${b.label.toUpperCase()} · КОСТАНАЙ</div>
   <h1>${b.heroTitle}</h1>
   <p>${b.heroText}</p>
   <button class="btn white" onclick="startBooking()">Записаться →</button>
  </div>
  <div id="installBanner" class="install-banner"><div style="font-size:23px">📱</div><div class="copy"><b>Установить «Коктем‑3»</b><small>Добавить приложение на экран телефона</small></div><button class="btn small ${currentBranch==='med'?'medprimary':''}" id="installBtn">Установить</button></div>
  <div class="section-title">Быстрые действия</div>
  <div class="grid2">
   <button class="quick" onclick="location.href='tel:${b.mobile.replace(/\s/g,'')}'"><div class="ico">☎️</div><b>Позвонить</b><small>${b.mobile}</small></button>
   <button class="quick" onclick="openWA('Здравствуйте! Хочу записаться в ${b.label.toLowerCase()} Коктем‑3.')"><div class="ico">💬</div><b>WhatsApp</b><small>Написать регистратуре</small></button>
  </div>
  ${latest?`<div class="card"><div class="between"><div><div class="kicker">ПОСЛЕДНЯЯ ЗАЯВКА</div><h3>${esc(latest.service)}</h3><div class="muted">${esc(latest.dateLabel)} · ${esc(latest.time)}</div></div><span class="badge ${badgeClass(latest.status)}">${esc(latest.status)}</span></div></div>`:''}
  <div class="section-title">${currentBranch==='dental'?'Стоматологические услуги':'Услуги и диагностика'}</div>
  <div class="service-grid">${b.services.slice(0,currentBranch==='med'?10:8).map(s=>`<button class="service-card" onclick="startBooking('${s.id}')"><div class="ico">${s.ico}</div><b>${s.name}</b><small>${s.sub}</small></button>`).join('')}</div>
  ${currentBranch==='med'?`<div class="card"><div class="kicker">ДИАГНОСТИКА И ЛЕЧЕНИЕ</div><h3>Физиотерапия, УЗИ, ФГДС, лаборатория</h3><p class="muted">В медицинском центре также доступны рентген/флюорография, ЭКГ, Холтер, СМАД и медицинские комиссии.</p></div>`:''}
  <div class="section-title">Специалисты</div>
  <div class="grid2">${b.doctors.filter(d=>d.id!=='regmed').slice(0,4).map(doctorCard).join('')}</div>
  <div class="section-title">Контакты</div>
  <div class="card"><div class="kicker">${b.label.toUpperCase()}</div><h3>${b.address}</h3><p class="info">☎ ${b.phone}<br>📱 ${b.mobile}</p><p class="muted">${b.hours}</p></div>
  <div class="card"><div class="kicker">ЦЕНЫ</div><h3>Прайс‑лист</h3><p class="muted">На официальном сайте точные цены опубликованы не по всем услугам, поэтому мы не показываем выдуманные суммы. В админ‑панели можно внести утверждённый прайс клиники.</p><button class="btn ${currentBranch==='med'?'medprimary':''} full" onclick="showTab('prices')">Открыть цены</button></div>
 `;
 installControls();
}
function doctorCard(d){
 return `<div class="doctor-card"><div class="photo"><div class="initials">${d.initials}</div>${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.style.display='none'">`:''}</div><div class="inner"><b>${esc(d.name)}</b><small>${esc(d.spec)}</small><button class="btn ${currentBranch==='med'?'softblue':'soft'} small" onclick="startBooking(null,'${d.id}')">Записаться</button></div></div>`;
}
function startBooking(serviceId=null,doctorId=null){
 booking={step:1,service:serviceId,doctor:doctorId,date:null,time:null};
 showTab('booking'); renderBooking();
}
function renderBooking(){
 let bars=`<div class="steps">${[1,2,3,4].map(i=>`<div class="bar ${i<=Math.min(booking.step,4)?'on':''}"></div>`).join('')}</div>`;
 let html=bars;
 if(booking.step===1){
  html+=`<div class="title">${B().icon} Выберите услугу</div><div class="sub">${B().label}. Сначала выберите направление, затем специалиста.</div><div class="service-grid">${B().services.map(s=>`<button class="service-card ${booking.service===s.id?'sel':''}" onclick="pickService('${s.id}')"><div class="ico">${s.ico}</div><b>${s.name}</b><small>${s.sub}</small></button>`).join('')}</div>${navButtons()}`;
 }
 if(booking.step===2){
  const s=getService(); let ids=s?.docs||[]; let docs=B().doctors.filter(d=>ids.includes(d.id));
  if(!docs.length) docs=B().doctors;
  html+=`<div class="title">Выберите специалиста</div><div class="sub">${s?s.name:''}</div>${docs.map(d=>doctorRow(d)).join('')}${navButtons()}`;
 }
 if(booking.step===3){
  html+=`<div class="title">Желаемая дата</div><div class="sub">Это заявка на время. Регистратура подтвердит фактическую доступность.</div><div class="dates">${bookingDates().map(d=>{let iso=localISO(d);return `<button class="date ${booking.date===iso?'sel':''}" onclick="pickDate('${iso}')"><span>${d.toLocaleDateString('ru-RU',{weekday:'short'})}</span><strong>${d.getDate()}</strong><span>${d.toLocaleDateString('ru-RU',{month:'short'})}</span></button>`}).join('')}</div>${booking.date?`<div class="section-title">Предпочтительное время</div><div class="slots">${timeSlots().map(t=>`<button class="slot ${booking.time===t?'sel':''}" onclick="pickTime('${t}')">${t}</button>`).join('')}</div>`:''}${navButtons()}`;
 }
 if(booking.step===4){
  html+=`<div class="title">Контакты пациента</div><div class="sub">После отправки заявка появится в админ‑панели этого устройства.</div>
  <div class="summary"><div class="sumrow"><span>Подразделение</span><b>${B().label}</b></div><div class="sumrow"><span>Услуга</span><b>${esc(getService()?.name||'')}</b></div><div class="sumrow"><span>Специалист</span><b>${esc(getDoctor()?.name||'')}</b></div><div class="sumrow"><span>Дата</span><b>${booking.date?dateLabel(booking.date):''}</b></div><div class="sumrow"><span>Время</span><b>${booking.time||''}</b></div></div>
  <label class="label">Имя и фамилия</label><input id="patientName" class="input" placeholder="Например, Анна Иванова">
  <label class="label">Телефон</label><input id="patientPhone" class="input" inputmode="tel" placeholder="+7 7__ ___ __ __">
  <label class="label">Комментарий</label><input id="patientComment" class="input" placeholder="Например, повторный приём">
  <div class="nav"><button class="btn ghost" onclick="back()">← Назад</button><button class="btn ${currentBranch==='med'?'medprimary':''}" onclick="submitBooking(false)">Сохранить заявку</button></div>
  <div style="height:8px"></div><button class="btn ${currentBranch==='med'?'softblue':'soft'} full" onclick="submitBooking(true)">Сохранить и открыть WhatsApp</button>
  <div class="note">Пока нет общей серверной базы, поэтому онлайн‑заявка на другом телефоне не появится у администратора автоматически. WhatsApp‑вариант уже передаёт заявку регистратуре.</div>`;
 }
 if(booking.step===5){
  html+=`<div class="success"><div class="okmark">✓</div><h2>Заявка создана</h2><p>Администратор может открыть её в разделе «Админ». Для реального многопользовательского режима следующим этапом подключим общую базу и авторизацию.</p><button class="btn ${currentBranch==='med'?'medprimary':''}" onclick="showTab('admin')">Открыть админ</button><div style="height:8px"></div><button class="btn ghost" onclick="showTab('home')">На главную</button></div>`;
 }
 qs('#booking').innerHTML=html;
}
function doctorRow(d){
 return `<button class="doctor ${booking.doctor===d.id?'sel':''}" onclick="pickDoctor('${d.id}')"><div class="avatar"><div class="fallback">${d.initials}</div>${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.style.display='none'">`:''}</div><div class="copy"><b>${esc(d.name)}</b><small>${esc(d.spec)}</small></div><div class="dot">●</div></button>`;
}
function navButtons(){return `<div class="nav">${booking.step>1?`<button class="btn ghost" onclick="back()">← Назад</button>`:''}<button class="btn ${currentBranch==='med'?'medprimary':''}" onclick="next()">Продолжить →</button></div>`}
function pickService(id){booking.service=id;if(booking.doctor&&!getService().docs.includes(booking.doctor))booking.doctor=null;renderBooking()}
function pickDoctor(id){booking.doctor=id;renderBooking()}
function pickDate(id){booking.date=id;booking.time=null;renderBooking()}
function pickTime(t){booking.time=t;renderBooking()}
function next(){
 if(booking.step===1&&!booking.service)return alert('Выберите услугу');
 if(booking.step===2&&!booking.doctor)return alert('Выберите специалиста');
 if(booking.step===3&&(!booking.date||!booking.time))return alert('Выберите дату и время');
 booking.step++;renderBooking();window.scrollTo(0,0);
}
function back(){booking.step=Math.max(1,booking.step-1);renderBooking();window.scrollTo(0,0)}
function bookingDates(){let a=[],d=new Date();for(let i=1;i<=9;i++){let x=new Date(d);x.setDate(d.getDate()+i);if(currentBranch==='med'&&x.getDay()===0)continue;a.push(x)}return a}
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(iso){return new Date(iso+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}
function timeSlots(){let day=new Date(booking.date+'T12:00:00').getDay();if(day===6)return['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30'];return['08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00']}
function submitBooking(sendWA){
 const n=qs('#patientName').value.trim(), p=qs('#patientPhone').value.trim(), c=qs('#patientComment').value.trim();
 if(n.length<2||p.length<7)return alert('Укажите имя и телефон');
 const item={id:Date.now(),branch:currentBranch,branchLabel:B().label,name:n,phone:p,comment:c,service:getService().name,doctor:getDoctor().name,date:booking.date,dateLabel:dateLabel(booking.date),time:booking.time,status:'Новая'};
 const l=getBookings();l.unshift(item);setBookings(l);
 if(sendWA){
  const msg=`Здравствуйте! Хочу записаться в «Коктем‑3».\n\nПодразделение: ${item.branchLabel}\nПациент: ${n}\nТелефон: ${p}\nУслуга: ${item.service}\nСпециалист: ${item.doctor}\nЖелаемые дата и время: ${item.dateLabel}, ${item.time}${c?`\nКомментарий: ${c}`:''}\n\nПожалуйста, подтвердите возможность записи.`;
  openWA(msg);
 }
 booking.step=5;renderBooking();
}
function openWA(text){window.open('https://wa.me/'+B().wa+'?text='+encodeURIComponent(text),'_blank')}

function renderDoctors(){
 qs('#doctors').innerHTML=`<div class="title">${B().icon} Специалисты</div><div class="sub">${B().label}. Фотографии и специальности взяты с официального сайта «Коктем‑3».</div><div class="grid2">${B().doctors.filter(d=>d.id!=='regmed').map(doctorCard).join('')}</div>`;
}
function renderPrices(){
 const data=getPrices()[currentBranch]||[];
 qs('#prices').innerHTML=`<div class="title">Цены</div><div class="sub">${B().label}. Пока точные суммы не внесены администратором, приложение показывает «Уточнить».</div>${data.map(p=>`<div class="price-item"><b>${esc(p.name)}</b><div class="amount">${esc(p.price)}</div></div>`).join('')}<div class="note">Чтобы не вводить пациентов в заблуждение, в этой версии нет выдуманных цен. Утверждённые суммы можно добавить через админ‑панель.</div>`;
}

function renderAdmin(){
 if(localStorage.getItem('k3_admin_logged')!=='1'){
  qs('#admin').innerHTML=`<div class="title">Админ‑панель</div><div class="sub">Управление заявками обоих подразделений и редактирование цен.</div><div class="card"><label class="label">Пароль</label><input id="adminPass" class="input" type="password" placeholder="Введите пароль"><div style="height:10px"></div><button class="btn ${currentBranch==='med'?'medprimary':''} full" onclick="loginAdmin()">Войти</button><div class="note">Демо‑пароль: <b>koktem3</b>. В рабочей версии заменим на персональную авторизацию.</div></div>`;return;
 }
 qs('#admin').innerHTML=`<div class="between"><div><div class="title" style="margin-bottom:2px">Админ‑панель</div><div class="sub" style="margin:0">Стоматология + медицинский центр</div></div><button class="btn ghost small" onclick="logoutAdmin()">Выйти</button></div>
 <div class="admin-tabs"><button class="admin-tab ${adminSection==='requests'?'active':''}" onclick="setAdminSection('requests')">Заявки</button><button class="admin-tab ${adminSection==='prices'?'active':''}" onclick="setAdminSection('prices')">Прайс</button></div><div id="adminBody"></div>`;
 renderAdminBody();
}
function setAdminSection(s){adminSection=s;renderAdmin()}
function renderAdminBody(){
 if(adminSection==='prices'){renderAdminPrices();return}
 const all=getBookings(), n=all.filter(x=>x.status==='Новая').length, c=all.filter(x=>x.status==='Подтверждена').length;
 qs('#adminBody').innerHTML=`<div class="grid2"><div class="card"><div class="kicker">НОВЫЕ</div><h3>${n}</h3></div><div class="card"><div class="kicker">ПОДТВЕРЖДЕНЫ</div><h3>${c}</h3></div></div>
 <div class="search" style="margin-top:10px"><input id="adminSearch" class="input" placeholder="Имя или врач" oninput="renderAdminList()"><select id="adminBranchFilter" class="select" onchange="renderAdminList()"><option value="">Все</option><option value="dental">Стоматология</option><option value="med">Медцентр</option></select></div>
 <div style="height:10px"></div><div id="adminList"></div>`;renderAdminList();
}
function renderAdminList(){
 const search=(qs('#adminSearch')?.value||'').toLowerCase(), bf=qs('#adminBranchFilter')?.value||'';
 const list=getBookings().filter(x=>(!bf||x.branch===bf)&&(!search||x.name.toLowerCase().includes(search)||x.doctor.toLowerCase().includes(search)));
 qs('#adminList').innerHTML=list.length?list.map(x=>`<div class="admin-item"><div class="between"><div><span class="badge ${badgeClass(x.status)}">${esc(x.status)}</span><div style="height:8px"></div><b>${esc(x.name)}</b><div class="muted">${esc(x.branchLabel)} · ${esc(x.phone)}</div></div><button class="btn danger small" onclick="deleteBooking(${x.id})">Удалить</button></div><div class="info" style="margin-top:10px"><b>${esc(x.service)}</b><br>${esc(x.doctor)}<br>${esc(x.dateLabel)} · ${esc(x.time)}</div><select class="status-select" onchange="updateStatus(${x.id},this.value)">${['Новая','Подтверждена','Завершена','Отменена'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):`<div class="card"><div class="muted">Заявок пока нет.</div></div>`;
}
function renderAdminPrices(){
 const d=getPrices();
 qs('#adminBody').innerHTML=`<div class="sub">Здесь можно заполнить цены для демонстрации на этом устройстве. После подключения базы настройки будут общими для всех пользователей.</div>
 <div class="section-title">🦷 Стоматология</div>${d.dental.map(p=>priceEdit('dental',p)).join('')}
 <div class="section-title">🩺 Медицинский центр</div>${d.med.map(p=>priceEdit('med',p)).join('')}
 <button class="btn full" onclick="savePriceEdits()">Сохранить цены</button>`;
}
function priceEdit(branch,p){return `<div class="price-item"><b>${esc(p.name)}</b><input class="input price-edit" data-branch="${branch}" data-id="${p.id}" value="${esc(p.price)}" style="margin-top:8px"></div>`}
function savePriceEdits(){
 const d=getPrices();document.querySelectorAll('.price-edit').forEach(inp=>{const arr=d[inp.dataset.branch],p=arr.find(x=>x.id===inp.dataset.id);if(p)p.price=inp.value.trim()||'Уточнить'});setPrices(d);alert('Цены сохранены на этом устройстве');
}
function loginAdmin(){if(qs('#adminPass').value===ADMIN_PASS){localStorage.setItem('k3_admin_logged','1');renderAdmin()}else alert('Неверный пароль')}
function logoutAdmin(){localStorage.removeItem('k3_admin_logged');renderAdmin()}
function updateStatus(id,status){const l=getBookings(),x=l.find(i=>i.id===id);if(x)x.status=status;setBookings(l);renderAdminList()}
function deleteBooking(id){if(!confirm('Удалить заявку?'))return;setBookings(getBookings().filter(x=>x.id!==id));renderAdminBody()}

function installControls(){
 const el=qs('#installBanner'),btn=qs('#installBtn');
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 if(deferredPrompt&&!standalone)el?.classList.add('show');
 if(ios&&!standalone){el?.classList.add('show');if(btn){btn.textContent='Как установить';btn.onclick=()=>alert('На iPhone: Safari → Поделиться → На экран «Домой» → Добавить.')}}
 else if(btn)btn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch{}deferredPrompt=null;el.classList.remove('show')}};
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(qs('#home').classList.contains('active'))renderHome()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));

applyTheme();renderHome();
</script>
</body>
</html>
