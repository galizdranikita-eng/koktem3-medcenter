const TIMES=['08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

let lang=localStorage.getItem('k3_lang')||'ru';
let branch=localStorage.getItem('k3_branch')||'dental';
let state={step:1,service:null,doctor:null,date:null,time:null,editingId:null};
let adminTab='requests';

const tr=k=>T[lang][k]||k;
const B=()=>DATA[branch];
const qs=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const sName=s=>s?.[lang]||s?.ru||'';
const dSpec=d=>d?.[lang]||d?.ru||'';

function setLang(l){lang=l;localStorage.setItem('k3_lang',l);document.documentElement.lang=l==='kk'?'kk':'ru';updateChrome();renderActive()}
function setBranch(b){branch=b;localStorage.setItem('k3_branch',b);applyTheme();updateChrome();renderActive()}
function applyTheme(){qs('#app').classList.toggle('medtheme',branch==='med')}
function updateChrome(){
 qs('#brandSub').textContent=tr('brand');
 qs('#langRu').classList.toggle('on',lang==='ru');qs('#langKk').classList.toggle('on',lang==='kk');
 qs('#branchDental').textContent=tr('dental');qs('#branchMed').textContent=tr('med');
 qs('#branchDental').classList.toggle('on',branch==='dental');qs('#branchMed').classList.toggle('on',branch==='med');
 [['tabHome','home'],['tabBook','book'],['tabMy','my'],['tabPrices','prices'],['tabAdmin','admin']].forEach(([id,k])=>qs('#'+id).textContent=tr(k));
}
function renderActive(){const id=document.querySelector('.screen.on')?.id||'home';if(id==='home')renderHome();if(id==='booking')renderBooking();if(id==='my')renderMy();if(id==='prices')renderPrices();if(id==='admin')renderAdmin()}
function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));qs('#'+id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));if(id==='home')renderHome();if(id==='my')renderMy();if(id==='prices')renderPrices();if(id==='admin')renderAdmin();window.scrollTo(0,0)}
function getBookings(){try{return JSON.parse(localStorage.getItem('k3_bookings_v4')||'[]')}catch{return[]}}
function saveBookings(v){localStorage.setItem('k3_bookings_v4',JSON.stringify(v))}
function getPrices(){try{return JSON.parse(localStorage.getItem('k3_prices_v4')||JSON.stringify(PRICE_DEFAULT))}catch{return JSON.parse(JSON.stringify(PRICE_DEFAULT))}}
function savePrices(v){localStorage.setItem('k3_prices_v4',JSON.stringify(v))}
function getSlots(){try{return JSON.parse(localStorage.getItem('k3_slots_v4')||'{}')}catch{return{}}}
function saveSlots(v){localStorage.setItem('k3_slots_v4',JSON.stringify(v))}
function slotKey(br,doc,date){return `${br}|${doc}|${date}`}
function serviceById(id){return B().services.find(x=>x.id===id)}
function doctorById(id){return B().doctors.find(x=>x.id===id)}
function branchLabel(id){return id==='dental'?T[lang].dental.replace('🦷 ',''):T[lang].med.replace('🩺 ','')}
function statusLabel(s){return s==='Новая'?tr('new'):s==='Подтверждена'?tr('confirmed'):s==='Завершена'?tr('completed'):s==='Отменена'?tr('cancelled'):s}
function badgeClass(s){return s==='Подтверждена'||s==='Завершена'?'ok':s==='Отменена'?'cancel':''}
function openWA(text){window.open('https://wa.me/'+B().wa+'?text='+encodeURIComponent(text),'_blank')}

function renderHome(){
 const b=B();
 qs('#home').innerHTML=`
 <div class="hero"><div class="eyebrow">${tr('online')}</div><h1>${branch==='dental'?tr('heroDental'):tr('heroMed')}</h1><p>${branch==='dental'?tr('heroDentalText'):tr('heroMedText')}</p><button class="btn white" onclick="startBooking()">${tr('bookNow')}</button></div>
 <div class="section-title">${tr('quick')}</div><div class="grid2">
  <button class="service" onclick="location.href='tel:${b.mobile.replace(/\s/g,'')}'"><div class="ico">☎️</div><b>${tr('call')}</b><small>${b.mobile}</small></button>
  <button class="service" onclick="openWA('${lang==='ru'?'Здравствуйте! Хочу записаться в Коктем‑3.':'Сәлеметсіз бе! Коктем‑3 орталығына жазылғым келеді.'}')"><div class="ico">💬</div><b>${tr('wa')}</b><small>${tr('write')}</small></button>
 </div>
 <div class="section-title">${tr('services')}</div><div class="grid2">${b.services.slice(0,10).map(s=>`<button class="service" onclick="startBooking('${s.id}')"><div class="ico">${s.ico}</div><b>${sName(s)}</b><small>${s['sub'+lang]||s.subru}</small></button>`).join('')}</div>
 <div class="section-title">${tr('specialists')}</div><div class="card">${b.doctors.slice(0,5).map(d=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0"><div class="avatar">${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.remove()">`:d.name.split(' ').slice(0,2).map(x=>x[0]).join('')}</div><div style="flex:1"><b style="font-size:12px">${esc(d.name)}</b><div class="muted">${esc(dSpec(d))}</div></div><button class="btn soft small" onclick="startBooking(null,'${d.id}')">${tr('book')}</button></div>`).join('')}</div>
 <div class="section-title">${tr('contacts')}</div><div class="card"><div class="info">📍 ${b.address}<br>☎ ${b.phone}<br>📱 ${b.mobile}</div></div>`;
}
function startBooking(service=null,doctor=null,editId=null){state={step:1,service,doctor,date:null,time:null,editingId:editId};showTab('booking');renderBooking()}
function renderBooking(){
 let html=`<div class="steps">${[1,2,3,4].map(i=>`<div class="bar ${i<=Math.min(state.step,4)?'on':''}"></div>`).join('')}</div>`;
 if(state.step===1)html+=`<div class="title">${tr('selectService')}</div><div class="grid2">${B().services.map(s=>`<button class="service ${state.service===s.id?'sel':''}" onclick="pickService('${s.id}')"><div class="ico">${s.ico}</div><b>${sName(s)}</b><small>${s['sub'+lang]||s.subru}</small></button>`).join('')}</div>${nav()}`;
 if(state.step===2){const ids=serviceById(state.service)?.docs||[];const docs=B().doctors.filter(d=>ids.includes(d.id));html+=`<div class="title">${tr('selectDoctor')}</div>${docs.map(d=>`<button class="doctor ${state.doctor===d.id?'sel':''}" onclick="pickDoctor('${d.id}')"><div class="avatar">${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.outerHTML='<span>'+('${d.name}'.split(' ').slice(0,2).map(x=>x[0]).join(''))+'</span>'">`:d.name.split(' ').slice(0,2).map(x=>x[0]).join('')}</div><div class="copy"><b>${esc(d.name)}</b><small>${esc(dSpec(d))}</small></div><div class="dot">●</div></button>`).join('')}${nav()}`;}
 if(state.step===3){
  const dates=futureDates();
  html+=`<div class="title">${tr('selectDate')}</div><div class="sub">${tr('realSlots')}</div><div class="dates">${dates.map(d=>{const iso=isoDate(d);return `<button class="date ${state.date===iso?'sel':''}" onclick="pickDate('${iso}')"><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{weekday:'short'})}</span><strong>${d.getDate()}</strong><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{month:'short'})}</span></button>`}).join('')}</div>${state.date?renderSlots():''}${nav()}`;
 }
 if(state.step===4)html+=`<div class="title">${tr('patient')}</div><div class="summary"><div class="sumrow"><span>${tr('branch')}</span><b>${branchLabel(branch)}</b></div><div class="sumrow"><span>${tr('service')}</span><b>${sName(serviceById(state.service))}</b></div><div class="sumrow"><span>${tr('doctor')}</span><b>${esc(doctorById(state.doctor)?.name||'')}</b></div><div class="sumrow"><span>${tr('date')}</span><b>${dateLabel(state.date)}</b></div><div class="sumrow"><span>${tr('time')}</span><b>${state.time}</b></div></div><label class="label">${tr('name')}</label><input id="pn" class="input"><label class="label">${tr('phone')}</label><input id="pp" class="input" inputmode="tel"><label class="label">${tr('comment')}</label><input id="pc" class="input"><div class="nav"><button class="btn ghost" onclick="prev()">${tr('back')}</button><button class="btn primary" onclick="submitBooking()">${tr('save')}</button></div>`;
 if(state.step===5)html+=`<div style="text-align:center;padding:32px 8px"><div style="font-size:56px">✓</div><div class="title">${tr('created')}</div><div class="sub">${tr('createdText')}</div><button class="btn full primary" onclick="showTab('my')">${tr('my')}</button></div>`;
 qs('#booking').innerHTML=html;
}
function nav(){return `<div class="nav">${state.step>1?`<button class="btn ghost" onclick="prev()">${tr('back')}</button>`:''}<button class="btn primary" onclick="next()">${tr('next')}</button></div>`}
function pickService(id){state.service=id;if(state.doctor&&!serviceById(id).docs.includes(state.doctor))state.doctor=null;renderBooking()}
function pickDoctor(id){state.doctor=id;renderBooking()}
function pickDate(d){state.date=d;state.time=null;renderBooking()}
function pickTime(t){state.time=t;renderBooking()}
function next(){if(state.step===1&&!state.service)return alert(tr('chooseService'));if(state.step===2&&!state.doctor)return alert(tr('chooseDoctor'));if(state.step===3&&(!state.date||!state.time))return alert(tr('chooseTime'));state.step++;renderBooking();window.scrollTo(0,0)}
function prev(){state.step=Math.max(1,state.step-1);renderBooking()}
function futureDates(){let a=[],d=new Date();for(let i=1;i<=10;i++){let x=new Date(d);x.setDate(d.getDate()+i);if(branch==='med'&&x.getDay()===0)continue;a.push(x)}return a}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(iso){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{day:'numeric',month:'long',weekday:'short'})}
function availableTimes(){
 const slots=getSlots(), key=slotKey(branch,state.doctor,state.date);
 if(Array.isArray(slots[key]))return slots[key];
 // Default demo slots until admin configures schedule
 return ['09:00','10:00','11:30','14:00','15:30','17:00'];
}
function renderSlots(){const av=availableTimes();return `<div class="section-title">${tr('time')}</div><div class="slots">${TIMES.map(t=>`<button class="slot ${state.time===t?'sel':''} ${av.includes(t)?'':'disabled'}" ${av.includes(t)?`onclick="pickTime('${t}')"`:'disabled'}>${t}</button>`).join('')}</div>`}
function submitBooking(){
 const name=qs('#pn').value.trim(),phone=qs('#pp').value.trim(),comment=qs('#pc').value.trim();if(name.length<2||phone.length<7)return alert(lang==='ru'?'Укажите имя и телефон':'Аты-жөніңіз бен телефоныңызды енгізіңіз');
 let list=getBookings();
 if(state.editingId){
  const x=list.find(i=>i.id===state.editingId);if(x){x.branch=branch;x.serviceId=state.service;x.service=sName(serviceById(state.service));x.doctorId=state.doctor;x.doctor=doctorById(state.doctor).name;x.date=state.date;x.dateLabel=dateLabel(state.date);x.time=state.time;x.status='Новая';x.comment=comment;}
 }else{
  list.unshift({id:Date.now(),branch,serviceId:state.service,service:sName(serviceById(state.service)),doctorId:state.doctor,doctor:doctorById(state.doctor).name,date:state.date,dateLabel:dateLabel(state.date),time:state.time,name,phone,comment,status:'Новая'});
 }
 saveBookings(list);state.step=5;renderBooking();
}
function renderMy(){
 const list=getBookings();
 qs('#my').innerHTML=`<div class="title">${tr('myTitle')}</div><div class="sub">${lang==='ru'?'Здесь можно перенести или отменить запись.':'Мұнда жазылуды ауыстыруға немесе одан бас тартуға болады.'}</div>${list.length?list.map(x=>bookingCard(x)).join(''):`<div class="card"><div class="muted">${tr('noBookings')}</div></div>`}`;
}
function bookingCard(x){return `<div class="booking-card"><div class="between"><div><span class="badge ${badgeClass(x.status)}">${statusLabel(x.status)}</span><div style="height:7px"></div><b>${esc(x.service)}</b><div class="muted">${esc(x.doctor)}</div></div><b>${esc(x.time)}</b></div><div class="info" style="margin-top:9px">${esc(x.dateLabel)}<br>${esc(x.name)} · ${esc(x.phone)}</div>${x.status!=='Отменена'?`<div class="actions"><button class="btn soft small" onclick="reschedule(${x.id})">${tr('reschedule')}</button><button class="btn danger small" onclick="cancelBooking(${x.id})">${tr('cancel')}</button><button class="btn ghost small" onclick="repeatBooking(${x.id})">${tr('repeat')}</button></div>`:''}</div>`}
function cancelBooking(id){if(!confirm(tr('cancel')+'?'))return;let l=getBookings(),x=l.find(i=>i.id===id);if(x)x.status='Отменена';saveBookings(l);renderMy()}
function reschedule(id){const x=getBookings().find(i=>i.id===id);if(!x)return;branch=x.branch;applyTheme();updateChrome();state={step:3,service:x.serviceId,doctor:x.doctorId,date:null,time:null,editingId:id};showTab('booking');renderBooking()}
function repeatBooking(id){const x=getBookings().find(i=>i.id===id);if(!x)return;branch=x.branch;applyTheme();updateChrome();startBooking(x.serviceId,x.doctorId,null)}
function renderPrices(){const p=getPrices()[branch]||[];qs('#prices').innerHTML=`<div class="title">${tr('priceTitle')}</div><div class="sub">${tr('priceText')}</div>${p.map(x=>`<div class="price-row"><b>${esc(x[lang]||x.ru)}</b><div class="amount">${x.price?esc(x.price+' ₸'):tr('clarify')}</div></div>`).join('')}`}

function renderAdmin(){
 if(localStorage.getItem('k3_admin_auth')!=='1'){qs('#admin').innerHTML=`<div class="title">${tr('adminTitle')}</div><div class="sub">${tr('adminSub')}</div><div class="card"><label class="label">${tr('password')}</label><input id="ap" class="input" type="password"><div style="height:10px"></div><button class="btn full primary" onclick="adminLogin()">${tr('login')}</button><div class="note">${tr('demoPass')}</div></div>`;return}
 qs('#admin').innerHTML=`<div class="between"><div><div class="title" style="margin-bottom:2px">${tr('adminTitle')}</div><div class="sub" style="margin:0">${tr('adminSub')}</div></div><button class="btn ghost small" onclick="adminLogout()">×</button></div><div class="admin-tabs"><button class="${adminTab==='requests'?'on':''}" onclick="adminTab='requests';renderAdmin()">${tr('requests')}</button><button class="${adminTab==='schedule'?'on':''}" onclick="adminTab='schedule';renderAdmin()">${tr('schedule')}</button><button class="${adminTab==='prices'?'on':''}" onclick="adminTab='prices';renderAdmin()">${tr('priceAdmin')}</button><button class="${adminTab==='reminders'?'on':''}" onclick="adminTab='reminders';renderAdmin()">${tr('reminders')}</button></div><div id="adminBody"></div>`;
 renderAdminBody();
}
function adminLogin(){if(qs('#ap').value==='koktem3'){localStorage.setItem('k3_admin_auth','1');renderAdmin()}else alert('Wrong password')}
function adminLogout(){localStorage.removeItem('k3_admin_auth');renderAdmin()}
function renderAdminBody(){
 if(adminTab==='requests'){const l=getBookings();qs('#adminBody').innerHTML=l.length?l.map(x=>`<div class="admin-card"><div class="between"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.service)}</div></div><button class="btn danger small" onclick="deleteBooking(${x.id})">${tr('delete')}</button></div><div class="info" style="margin-top:8px">${esc(x.doctor)}<br>${esc(x.dateLabel)} · ${esc(x.time)}</div><label class="label">${tr('status')}</label><select class="select" onchange="setStatus(${x.id},this.value)">${['Новая','Подтверждена','Завершена','Отменена'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></div>`).join(''):`<div class="card"><div class="muted">${tr('noRequests')}</div></div>`}
 if(adminTab==='schedule')renderScheduleAdmin();
 if(adminTab==='prices')renderPriceAdmin();
 if(adminTab==='reminders')renderReminderAdmin();
}
function setStatus(id,s){let l=getBookings(),x=l.find(i=>i.id===id);if(x)x.status=s;saveBookings(l)}
function deleteBooking(id){if(!confirm(tr('delete')+'?'))return;saveBookings(getBookings().filter(x=>x.id!==id));renderAdminBody()}
function renderScheduleAdmin(){
 const docs=B().doctors, dates=futureDates();qs('#adminBody').innerHTML=`<div class="card"><label class="label">${tr('chooseAdminDoctor')}</label><select id="sd" class="select" onchange="renderSlotEditor()">${docs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><label class="label">${tr('chooseAdminDate')}</label><select id="sdate" class="select" onchange="renderSlotEditor()">${dates.map(d=>{const iso=isoDate(d);return `<option value="${iso}">${dateLabel(iso)}</option>`}).join('')}</select></div><div id="slotEditor"></div>`;renderSlotEditor()
}
function renderSlotEditor(){
 const d=qs('#sd')?.value,dt=qs('#sdate')?.value;if(!d||!dt)return;const slots=getSlots(),key=slotKey(branch,d,dt),active=Array.isArray(slots[key])?slots[key]:['09:00','10:00','11:30','14:00','15:30','17:00'];qs('#slotEditor').innerHTML=`<div class="section-title">${tr('openSlots')}</div><div class="slots">${TIMES.map(t=>`<button class="slot ${active.includes(t)?'sel':''}" data-time="${t}" onclick="this.classList.toggle('sel')">${t}</button>`).join('')}</div><div style="height:10px"></div><button class="btn full primary" onclick="saveAdminSlots('${d}','${dt}')">${tr('saveSlots')}</button>`;
}
function saveAdminSlots(d,dt){const active=[...document.querySelectorAll('#slotEditor .slot.sel')].map(x=>x.dataset.time),slots=getSlots();slots[slotKey(branch,d,dt)]=active;saveSlots(slots);alert(tr('saveSlots'))}
function renderPriceAdmin(){const all=getPrices(),arr=all[branch];qs('#adminBody').innerHTML=`${arr.map(x=>`<div class="price-row"><b>${esc(x[lang]||x.ru)}</b><input class="input pedit" data-id="${x.id}" inputmode="numeric" placeholder="${tr('clarify')}" value="${esc(x.price)}" style="margin-top:7px"></div>`).join('')}<button class="btn full primary" onclick="saveAdminPrices()">${tr('savePrices')}</button>`}
function saveAdminPrices(){const all=getPrices(),arr=all[branch];document.querySelectorAll('.pedit').forEach(i=>{const x=arr.find(p=>p.id===i.dataset.id);if(x)x.price=i.value.replace(/[^\d]/g,'')});savePrices(all);alert(tr('pricesSaved'))}
function renderReminderAdmin(){const l=getBookings().filter(x=>x.status!=='Отменена');qs('#adminBody').innerHTML=`<div class="note">${tr('remindersText')}</div><div style="height:10px"></div><button class="btn full primary" onclick="requestPush()">${tr('enablePush')}</button><div style="height:12px"></div>${l.map(x=>`<div class="admin-card"><b>${esc(x.name)}</b><div class="muted">${esc(x.dateLabel)} · ${esc(x.time)} · ${esc(x.doctor)}</div><div style="height:8px"></div><button class="btn soft small" onclick="sendReminder(${x.id})">${tr('sendWA')}</button></div>`).join('')}`}
async function requestPush(){if(!('Notification'in window))return alert('Not supported');const r=await Notification.requestPermission();if(r==='granted')alert(tr('pushGranted'))}
function sendReminder(id){const x=getBookings().find(i=>i.id===id);if(!x)return;branch=x.branch;applyTheme();updateChrome();const txt=lang==='ru'?`Здравствуйте, ${x.name}! Напоминаем о записи в «Коктем‑3»: ${x.dateLabel} в ${x.time}. Специалист: ${x.doctor}.`:`Сәлеметсіз бе, ${x.name}! «Коктем‑3» орталығындағы жазылуыңызды еске саламыз: ${x.dateLabel}, ${x.time}. Маман: ${x.doctor}.`;openWA(txt)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
applyTheme();updateChrome();renderHome();
</script>
</body>
</html>
