:root{
  --green:#0e6b5c; --green2:#18a38b; --blue:#2c6da2; --blue2:#69abd8;
  --bg:#f4f8f7; --card:#fff; --ink:#132220; --muted:#6f807b; --line:#dce8e4;

  --shadow:0 10px 28px rgba(20,54,47,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100dvh;padding-bottom:86px}
.top{position:sticky;top:0;z-index:60;background:rgba(244,248,247,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,232,228,.9);padding:12px 14px 10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(145deg,var(--green),var(--green2));display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900;box-shadow:0 10px 20px rgba(14,107,92,.18)}
.brand b{display:block;font-size:18px;letter-spacing:-.2px}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.lang{display:flex;gap:4px;background:#e7efed;padding:4px;border-radius:13px}
.lang button{border:0;background:transparent;padding:7px 10px;border-radius:10px;font-size:10px;font-weight:900;color:#61716c}
.lang button.on{background:#fff;color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.branch-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e7efed;padding:4px;border-radius:15px;margin-top:10px}
.branch-switch button{border:0;background:transparent;padding:10px 6px;border-radius:12px;font-size:11px;font-weight:900;color:#6b7a76}
.branch-switch button.on{background:#fff;color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.medtheme .branch-switch button.on{color:var(--blue)}
.screen{display:none;padding:14px 15px 28px}
.screen.on{display:block}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:25px 22px;color:#fff;background:linear-gradient(145deg,#0b5d51,#18a28a);box-shadow:0 16px 35px rgba(14,69,59,.18)}
.medtheme .hero{background:linear-gradient(145deg,#275b87,#68abd8)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero:before{width:170px;height:170px;right:-70px;top:-75px}
.hero:after{width:120px;height:120px;right:20px;bottom:-70px}
.eyebrow{position:relative;z-index:1;font-size:10px;font-weight:900;letter-spacing:1.2px;color:#d6f3eb}
.hero h1{position:relative;z-index:1;font-size:32px;line-height:1.03;letter-spacing:-1px;margin:12px 0 10px}
.hero p{position:relative;z-index:1;font-size:13px;line-height:1.55;color:#e9f7f4;max-width:380px;margin:0 0 18px}
.btn{border:0;border-radius:16px;min-height:46px;padding:0 16px;font-weight:900;font-size:13px}
.btn.primary{background:var(--green);color:#fff}
.medtheme .btn.primary{background:var(--blue)}
.btn.white{background:#fff;color:var(--green)}
.medtheme .btn.white{color:var(--blue)}
.btn.soft{background:var(--soft);color:var(--green)}
.medtheme .btn.soft{background:var(--softb);color:var(--blue)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--green)}
.medtheme .btn.ghost{color:var(--blue)}
.btn.danger{background:#fff;border:1px solid #edd4d1;color:var(--danger)}
.btn.full{width:100%}
.btn.small{min-height:38px;padding:0 12px;border-radius:12px;font-size:11px}
.section-title{font-size:21px;font-weight:900;letter-spacing:-.4px;margin:22px 0 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick,.service-card,.info-card,.doctor-card,.booking-card,.price-row,.admin-card,.slot,.date{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.quick,.service-card,.info-card,.admin-card,.price-row,.booking-card{padding:15px}
.quick .ico,.service-card .ico{font-size:24px}
.quick b,.service-card b{display:block;font-size:14px;margin-top:8px}
.quick small,.service-card small,.muted{color:var(--muted);font-size:11px;line-height:1.45}
.service-card{min-height:136px;text-align:left;position:relative;overflow:hidden}
.service-card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-25px;bottom:-30px;background:rgba(14,107,92,.05)}
.medtheme .service-card:after{background:rgba(44,109,162,.06)}
.info-card h3{margin:2px 0 8px;font-size:18px}
.info{font-size:12px;line-height:1.6}
.doctor-scroll{display:flex;gap:12px;overflow:auto;scrollbar-width:none;padding-bottom:2px}
.doctor-scroll::-webkit-scrollbar{display:none}
.doctor-card{min-width:250px;overflow:hidden;padding:0}
.doctor-photo{height:220px;background:linear-gradient(145deg,#ddecf2,#eef7f4);position:relative}
.doctor-photo img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--green)}
.medtheme .fallback{color:var(--blue)}
.doctor-body{padding:15px}
.doctor-body b{display:block;font-size:15px;line-height:1.35}
.doctor-body small{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin:5px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-block;background:#edf7f3;color:var(--green);padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}
.medtheme .chip{background:#edf5fb;color:var(--blue)}
.title{font-size:29px;font-weight:900;letter-spacing:-.8px;line-height:1.04;margin:8px 0}
.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:14px}
.steps{display:flex;gap:5px;margin:8px 0 18px}
.bar{height:6px;background:#dce8e4;border-radius:999px;flex:1}
.bar.on{background:var(--green)}
.medtheme .bar.on{background:var(--blue)}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.service-mini{padding:14px;border:1px solid var(--line);background:#fff;border-radius:20px;text-align:left;box-shadow:var(--shadow)}
.service-mini.sel,.doctor-line.sel,.slot.sel,.date.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,107,92,.06)}
.medtheme .service-mini.sel,.medtheme .doctor-line.sel,.medtheme .slot.sel,.medtheme .date.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,109,162,.06)}
.service-mini .ico{font-size:24px}.service-mini b{display:block;font-size:13px;margin:7px 0 4px}.service-mini small{font-size:10px;color:var(--muted);line-height:1.35}
.doctor-line{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);background:#fff;border-radius:20px;margin-bottom:8px;box-shadow:var(--shadow)}
.doc-thumb{width:64px;height:64px;border-radius:18px;overflow:hidden;background:#edf7f3;display:grid;place-items:center;font-weight:900;color:var(--green);flex:0 0 64px}
.medtheme .doc-thumb{background:#edf5fb;color:var(--blue)}
.doc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.doctor-line b{display:block;font-size:13px;line-height:1.35}
.doctor-line small{display:block;color:var(--muted);font-size:10px;line-height:1.35;margin-top:3px}
.dates{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:2px 0 8px}

.date strong{display:block;font-size:20px;margin:2px 0}
.date.sel{background:var(--green);color:#fff}
.medtheme .date.sel{background:var(--blue)}

.label{display:block;font-size:11px;font-weight:900;margin:12px 0 6px}

.sumrow b{text-align:right}
.nav{display:flex;gap:8px;margin-top:18px}

.booking-card b{font-size:14px}
.badge{display:inline-block;padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900;background:var(--amber);color:#755900}

.medtheme .amount{color:var(--blue)}
.admin-tabs{display:flex;gap:6px;overflow:auto;background:#e7efed;padding:4px;border-radius:15px;margin:10px 0}
.admin-tabs button{border:0;background:transparent;padding:9px 10px;border-radius:11px;font-size:10px;font-weight:900;white-space:nowrap}
.admin-tabs button.on{background:#fff;color:var(--green)}
.note{background:#fff9e8;border:1px solid #f0e2ba;color:#735b1e;padding:11px;border-radius:14px;font-size:10px;line-height:1.45;margin-top:10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;height:78px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:70;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:transparent;color:#82918d;font-size:9px;font-weight:900}
.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.tab.on{color:var(--green)}
.medtheme .tab.on{color:var(--blue)}

</head>

function startBooking(service=null,doctor=null,editId=null){

function nav(){return `<div class="nav">${booking.step>1?`<button class="btn ghost" onclick="booking.step--;renderBooking()">${tr('back')}</button>`:''}<button class="btn primary" onclick="nextBooking()">${tr('next')}</button></div>`}
function renderBooking(){
  let html=`<div class="steps">${[1,2,3,4].map(i=>`<div class="bar ${i<=Math.min(booking.step,4)?'on':''}"></div>`).join('')}</div>`;
  if(booking.step===1){
    html+=`<div class="title">${tr('selectService')}</div><div class="picker-grid">${B().services.map(s=>`<button class="service-mini ${booking.service===s.id?'sel':''}" onclick="booking.service='${s.id}'; if(booking.doctor && !serviceById('${s.id}').docs.includes(booking.doctor)) booking.doctor=null; renderBooking();"><div class="ico">${s.ico}</div><b>${sName(s)}</b><small>${s['sub'+lang]||s.subru}</small></button>`).join('')}</div>${nav()}`
  }
  if(booking.step===2){
    const docs=B().doctors.filter(d=>(serviceById(booking.service)?.docs||[]).includes(d.id));
    html+=`<div class="title">${tr('selectDoctor')}</div>${docs.map(d=>{const init=d.name.split(' ').slice(0,2).map(x=>x[0]).join(''); return `<button class="doctor-line ${booking.doctor===d.id?'sel':''}" onclick="booking.doctor='${d.id}'; renderBooking();"><div class="doc-thumb">${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" onerror="this.remove()">`:init}</div><div><b>${esc(d.name)}</b><small>${esc(dSpec(d))}</small></div></button>`}).join('')}${nav()}`
  }
  if(booking.step===3){
    const dates=nextDates();
    html+=`<div class="title">${tr('selectDate')}</div><div class="sub">${tr('realSlots')}</div><div class="dates">${dates.map(d=>{const iso=isoDate(d);return `<button class="date ${booking.date===iso?'sel':''}" onclick="booking.date='${iso}';booking.time=null;renderBooking()"><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{weekday:'short'})}</span><strong>${d.getDate()}</strong><span>${d.toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{month:'short'})}</span></button>`}).join('')}</div>${booking.date?renderSlots():''}${nav()}`
  }
  if(booking.step===4){
    html+=`<div class="title">${tr('patient')}</div>
      <div class="summary">
        <div class="sumrow"><span>${tr('branch')}</span><b>${branch==='dental'?tr('dental').replace('🦷 ',''):tr('med').replace('🩺 ','')}</b></div>
        <div class="sumrow"><span>${tr('service')}</span><b>${sName(serviceById(booking.service))}</b></div>
        <div class="sumrow"><span>${tr('doctor')}</span><b>${esc(doctorById(booking.doctor)?.name||'')}</b></div>
        <div class="sumrow"><span>${tr('date')}</span><b>${booking.date?dateLabel(booking.date):''}</b></div>
        <div class="sumrow"><span>${tr('time')}</span><b>${booking.time||''}</b></div>
      </div>
      <label class="label">${tr('name')}</label><input id="bn" class="input">
      <label class="label">${tr('phone')}</label><input id="bp" class="input" inputmode="tel">
      <label class="label">${tr('comment')}</label><textarea id="bc" class="textarea" rows="3"></textarea>
      <div class="nav"><button class="btn ghost" onclick="booking.step--;renderBooking()">${tr('back')}</button><button class="btn primary" onclick="saveBookingFlow()">${tr('confirm')}</button></div>`
  }
  if(booking.step===5){
    html+=`<div style="text-align:center;padding:36px 8px"><div style="font-size:58px">✓</div><div class="title">${tr('created')}</div><div class="sub">${tr('createdText')}</div><button class="btn primary full" onclick="showTab('my')">${tr('my')}</button></div>`
  }
  qs('#booking').innerHTML=html;
}
function nextBooking(){
  if(booking.step===1 && !booking.service) return alert(tr('chooseService'));
  if(booking.step===2 && !booking.doctor) return alert(tr('chooseDoctor'));
  if(booking.step===3 && (!booking.date || !booking.time)) return alert(tr('chooseTime'));
  booking.step++; renderBooking();
}
function nextDates(){let a=[],d=new Date();for(let i=1;i<=9;i++){let x=new Date(d);x.setDate(d.getDate()+i);if(branch==='med'&&x.getDay()===0)continue;a.push(x)}return a}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(iso){return new Date(iso+'T12:00:00').toLocaleDateString(lang==='kk'?'kk-KZ':'ru-RU',{weekday:'short',day:'numeric',month:'long'})}
function slotsFor(){
  const slots=getSlots(), key=slotKey(branch,booking.doctor,booking.date);
  return Array.isArray(slots[key])?slots[key]:['09:00','10:00','11:30','14:00','15:30','17:00'];
}
function renderSlots(){const available=slotsFor();return `<div class="section-title">${tr('time')}</div><div class="slots">${TIMES.map(t=>`<button class="slot ${booking.time===t?'sel':''} ${available.includes(t)?'':'disabled'}" ${available.includes(t)?`onclick="booking.time='${t}';renderBooking()"`:'disabled'}>${t}</button>`).join('')}</div>`}
function saveBookingFlow(){
  const n=qs('#bn').value.trim(), p=qs('#bp').value.trim(), c=qs('#bc').value.trim();
  if(n.length<2||p.length<7) return alert(lang==='ru'?'Укажите имя и телефон':'Аты-жөні мен телефонды енгізіңіз');
  let list=getBookings();
  if(booking.editId){
    const item=list.find(x=>x.id===booking.editId);
    if(item){item.branch=branch;item.serviceId=booking.service;item.service=sName(serviceById(booking.service));item.doctorId=booking.doctor;item.doctor=doctorById(booking.doctor).name;item.date=booking.date;item.dateLabel=dateLabel(booking.date);item.time=booking.time;item.status='Новая';item.comment=c;}
  }else{
    list.unshift({id:Date.now(),branch,serviceId:booking.service,service:sName(serviceById(booking.service)),doctorId:booking.doctor,doctor:doctorById(booking.doctor).name,date:booking.date,dateLabel:dateLabel(booking.date),time:booking.time,name:n,phone:p,comment:c,status:'Новая'});
  }
  saveBookings(list); booking.step=5; renderBooking();
}

  if(adminMode==='reminders'){
    const list=getBookings().filter(x=>x.status!=='Отменена');
    qs('#adminBody').innerHTML=`<div class="note">${tr('reminderText')}</div><div style="height:10px"></div>${list.map(x=>`<div class="admin-card"><b>${esc(x.name)}</b><div class="muted">${esc(x.dateLabel)} · ${esc(x.time)} · ${esc(x.doctor)}</div><div style="height:9px"></div><button class="btn soft small" onclick="sendReminder(${x.id})">${tr('sendWA')}</button></div>`).join('')}`;
  }
}
function deleteReq(id){if(!confirm(tr('delete')+'?'))return;saveBookings(getBookings().filter(x=>x.id!==id));renderAdminBody()}
function setReqStatus(id,val){let l=getBookings(),x=l.find(i=>i.id===id); if(x)x.status=val; saveBookings(l)}
function renderSlotEditor(){
  const doc=qs('#adoc')?.value, date=qs('#adate')?.value; if(!doc||!date) return;
  const slots=getSlots(), key=slotKey(branch,doc,date), active=Array.isArray(slots[key])?slots[key]:['09:00','10:00','11:30','14:00','15:30','17:00'];
  qs('#slotEditor').innerHTML=`<div class="section-title">${tr('openSlots')}</div><div class="slots">${TIMES.map(t=>`<button class="slot ${active.includes(t)?'sel':''}" data-time="${t}" onclick="this.classList.toggle('sel')">${t}</button>`).join('')}</div><div style="height:10px"></div><button class="btn primary full" onclick="saveAdminSlots('${doc}','${date}')">${tr('saveSlots')}</button>`;
}
function saveAdminSlots(doc,date){
  const active=[...document.querySelectorAll('#slotEditor .slot.sel')].map(x=>x.dataset.time);
  const slots=getSlots(); slots[slotKey(branch,doc,date)]=active; saveSlots(slots); alert(tr('saved'));
}
function saveAdminPrices(){
  const all=getPrices(), rows=all[branch];
  document.querySelectorAll('.pe').forEach(inp=>{const x=rows.find(r=>r.id===inp.dataset.id); if(x)x.price=inp.value.replace(/[^\d]/g,'')});
  savePrices(all); alert(tr('pricesSaved'));
}
function sendReminder(id){
  const x=getBookings().find(i=>i.id===id); if(!x) return;
  const msg=lang==='ru'
    ? `Здравствуйте, ${x.name}! Напоминаем о записи в «Коктем‑3»: ${x.dateLabel}, ${x.time}. Врач: ${x.doctor}.`
    : `Сәлеметсіз бе, ${x.name}! «Коктем‑3» орталығындағы жазылуыңызды еске саламыз: ${x.dateLabel}, ${x.time}. Дәрігер: ${x.doctor}.`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
renderShell(); renderHome();
</script>
</body>
</html>
